name: click_seguro_app
description: 'Click Seguro'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7
  get_it: ^9.2.1
  provider: ^6.1.5+1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.5
  fpdart: ^1.2.0
  go_router: ^17.3.0
  lucide_icons_flutter: ^3.1.15
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  flutter_svg: 2.3.0
  animations: ^3.0.0
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/data/official_contacts.json
    - assets/branding/click_seguro_logo.png
    - assets/illustrations/

  # Inter (SIL OFL 1.1, assets/fonts/OFL.txt), empacotada para funcionar
  # offline (specs/023-redesign-visual, R2).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
